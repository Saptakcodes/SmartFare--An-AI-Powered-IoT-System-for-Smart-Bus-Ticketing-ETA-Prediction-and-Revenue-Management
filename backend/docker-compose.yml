services:
  db:
    image: postgis/postgis:16-3.4
    container_name: smartfare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartfare
      POSTGRES_PASSWORD: smartfare
      POSTGRES_DB: smartfare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfare -d smartfare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartfare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: